name: Publish to crates.io

# Triggers when a tag matching `v*` is pushed (e.g. `v1.0.0`,
# `v1.0.1`). Publishes directly — pushing a tag IS the approval.
# Don't push tags from branches you don't intend to release.
#
# Order: vaultdb-core first (it's the dep root), then a wait for
# the crates.io index to settle, then vaultdb-mcp and vaultdb
# (CLI) in parallel — they only depend on vaultdb-core.

on:
  push:
    tags:
      - 'v*'
  # `workflow_dispatch` lets you re-run a publish manually from
  # the Actions UI (e.g. after a transient crates.io failure).
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish (e.g. v1.0.0)'
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  publish-core:
    name: publish vaultdb-core
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo publish vaultdb-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p vaultdb-core

  # Wait for the crates.io sparse index to pick up the freshly-
  # published vaultdb-core. crates.io recommends ~30s; we use 60s
  # for a safety margin so the downstream publishes don't race.
  wait-for-index:
    name: wait for index
    needs: publish-core
    runs-on: ubuntu-22.04
    steps:
      - run: sleep 60

  publish-downstream:
    name: publish ${{ matrix.crate }}
    needs: wait-for-index
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        crate: [vaultdb-mcp, vaultdb]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo publish ${{ matrix.crate }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p ${{ matrix.crate }}

  github-release:
    name: github release
    needs: publish-downstream
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          # Auto-generated release notes from the commit log between
          # the previous release and this one. Editable in the UI
          # before clicking Publish.
          generate_release_notes: true
          draft: true
          prerelease: false
