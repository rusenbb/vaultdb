[package]
name = "vaultdb-wasm"
description = "WASM bindings for vaultdb-core (parser + where-DSL evaluator, runs in any browser or Node)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["wasm", "obsidian", "markdown", "vaultdb", "browser"]
categories = ["wasm", "api-bindings", "parser-implementations"]

# `cdylib` is what `wasm-pack` packages into a `.wasm` module.
# `rlib` is kept for in-workspace tests and so the binding can be
# pulled in by other Rust crates without a wasm toolchain.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
vaultdb-core = { path = "../../crates/vaultdb-core", version = "1.1.0" }
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
# wasm32 builds need a getrandom configuration to work — vaultdb-core
# pulls in `rand` via its writer module's atomic-write tempfile names,
# which on WASM falls back to JS `crypto.getRandomValues`. We don't
# call those code paths from the WASM API but the link still has to
# resolve.
js-sys = "0.3"

# Optional; lets `wasm-pack test --node` work without extra setup.
[dev-dependencies]
wasm-bindgen-test = "0.3"
