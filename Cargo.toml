[workspace]
resolver = "2"
members = [
    "crates/vaultdb-core",
    "crates/vaultdb-fts",
    "crates/vaultdb-orm",
    "crates/vaultdb-orm-macros",
    "crates/vaultdb",
    "crates/vaultdb-mcp",
    "bindings/vaultdb-pyo3",
    "bindings/vaultdb-wasm",
]

[workspace.package]
version = "1.5.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/rusenbb/vaultdb"
readme = "README.md"

# Centralised dependency versions. Each crate references these via
# `dep.workspace = true`. Adding `features = [...]` at the crate level
# extends, rather than replaces, the workspace's features.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
anyhow = "1"
thiserror = "2"
tempfile = "3"
tracing = "0.1"
clap = { version = "4", features = ["derive"] }
# Used by vaultdb-core to validate `type: url` schema fields. Eduport
# also pulls this in independently; centralising the version keeps the
# two consumers locked together.
url = "2"
# CSV writer for the `render` module's CSV / TSV export. Used by both
# vaultdb-core (the renderer) and the vaultdb CLI binary.
csv = "1"
# XLSX writer, gated behind vaultdb-core's `xlsx` feature. Both binaries
# (vaultdb, vaultdb-mcp) enable that feature explicitly; wasm / pyo3
# bindings opt out by default.
rust_xlsxwriter = "0.93"

[profile.release]
lto = true
codegen-units = 1
strip = true
