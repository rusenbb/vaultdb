[package]
name = "vaultdb-core"
description = "Library engine for vaultdb — markdown-as-database for Obsidian-style vaults"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["obsidian", "markdown", "yaml", "frontmatter", "database"]
categories = ["database", "filesystem", "parser-implementations"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
regex = "1"
walkdir = "2"
thiserror = "2"
fs2 = "0.4"
tempfile = "3"
tracing = "0.1"
pest = "2"
pest_derive = "2"

[dev-dependencies]
tempfile = "3"
