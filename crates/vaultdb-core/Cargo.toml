[package]
name = "vaultdb-core"
version = "0.1.0"
edition = "2024"
description = "Library engine for vaultdb — markdown-as-database for Obsidian-style vaults"
license = "MIT"
repository = "https://github.com/rusenbb/vaultdb"
readme = "../../README.md"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
regex = "1"
walkdir = "2"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
