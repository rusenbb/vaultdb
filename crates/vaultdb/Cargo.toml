[package]
name = "vaultdb"
description = "Database-like operations on Obsidian markdown files with YAML frontmatter"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["obsidian", "markdown", "database", "cli", "knowledge-graph"]
categories = ["command-line-utilities", "database"]

[[bin]]
name = "vaultdb"
path = "src/main.rs"

[dependencies]
# Path + version: local dev links via `path`, crates.io resolves via
# `version`. Required for publishing the CLI alongside the library.
vaultdb-core = { path = "../vaultdb-core", version = "1.0.0" }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
comfy-table = "7"
colored = "2"
anyhow.workspace = true
csv = "1"

[dev-dependencies]
tempfile.workspace = true
assert_cmd = "2"
predicates = "3"
