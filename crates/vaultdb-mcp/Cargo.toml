[package]
name = "vaultdb-mcp"
description = "Model Context Protocol server exposing vaultdb-core to LLM agents"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["mcp", "llm", "obsidian", "markdown", "vaultdb"]
categories = ["command-line-utilities", "database"]

[[bin]]
name = "vaultdb-mcp"
path = "src/main.rs"

[dependencies]
# Both `path` and `version` so that:
#   - local development stays linked to the in-tree source via `path`
#   - `cargo publish` resolves the dependency by version on crates.io
# Required by crates.io: every dependency of a published crate must
# declare a version requirement. The `xlsx` feature is enabled so
# `export: "foo.xlsx"` works for any read tool.
vaultdb-core = { path = "../vaultdb-core", version = "1.1.1", features = ["xlsx"] }
rmcp = { version = "1.6", features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "signal"] }
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
schemars = "1"
clap.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile.workspace = true
