[package]
name = "vaultdb-mcp"
description = "Model Context Protocol server exposing vaultdb-core to LLM agents"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["mcp", "llm", "obsidian", "markdown", "vaultdb"]
categories = ["command-line-utilities", "database"]

[[bin]]
name = "vaultdb-mcp"
path = "src/main.rs"

[dependencies]
# Both `path` and `version` so that:
#   - local development stays linked to the in-tree source via `path`
#   - `cargo publish` resolves the dependency by version on crates.io
# Required by crates.io: every dependency of a published crate must
# declare a version requirement.
vaultdb-core = { path = "../vaultdb-core", version = "1.0.0" }
rmcp = { version = "1.6", features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
schemars = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
