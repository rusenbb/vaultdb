[package]
name = "vaultdb-orm"
description = "Typed model layer over vaultdb-core — declare a struct, query it like a database row"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["vaultdb", "orm", "markdown", "obsidian", "database"]
categories = ["database", "data-structures"]

[dependencies]
vaultdb-core = { path = "../vaultdb-core", version = "1.2.1" }
vaultdb-orm-macros = { path = "../vaultdb-orm-macros", version = "1.2.1" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { version = "1", features = ["macros", "rt"] }
